common:
  img_topic: "/geode/left_camera"
  semantic_topic: "/semantic_inference/semantic_color/image_raw"
  lid_topic: "/livox/lidar"
  imu_topic: "/imu/data"
  img_en: 1
  semantic_en: 0
  lidar_en: 1
  ros_driver_bug_fix: false
  use_external_odom: false

extrin_calib:
  # GEODE Gamma: T_IMU_LiDAR (Xsens MTi-30 → Livox AVIA)
  extrinsic_T: [0.049258, -0.012500, 0.026946]
  extrinsic_R: [ 0.999620,  0.027463,  0.002445,
                -0.027517,  0.999299,  0.025398,
                -0.001746, -0.025456,  0.999674]
  # GEODE Gamma: T_LiDAR_CamL (Livox AVIA → Left Camera)
  Rcl: [ 0.030481734, -0.999506201, -0.007630027,
         0.010470227,  0.007952445, -0.999913563,
         0.999480484,  0.030399211,  0.010707461]
  Pcl: [-0.124309171, -0.044253387,  0.150907406]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1  # AVIA (Livox)
  scan_line: 6
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.3
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.01
  voxel_size: 0.5
  max_layer: 3
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "stairs_gamma"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1
