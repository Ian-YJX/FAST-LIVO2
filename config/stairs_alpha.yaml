common:
  img_topic: "/geode/left_camera"
  semantic_topic: "/semantic_inference/semantic_color/image_raw"
  lid_topic: "/velodyne_points"
  imu_topic: "/imu/data"
  img_en: 1
  semantic_en: 0
  lidar_en: 1
  ros_driver_bug_fix: false
  use_external_odom: false

extrin_calib:
  # GEODE Alpha: T_IMU_LiDAR (Xsens MTi-30 → Velodyne VLP-16)
  extrinsic_T: [0.010965, -0.086864, 0.060426]
  extrinsic_R: [0.9989892,  0.0444870, -0.0064406,
               -0.0446353,  0.9986885, -0.0250789,
                0.0053164,  0.0253410,  0.9996647]
  # GEODE Alpha: T_LiDAR_CamL (VLP-16 → Left Camera)
  # Rcl: [ 0.015753553, -0.000763582,  0.999875614,
  #       -0.999845585,  0.007775524,  0.015759018,
  #       -0.007786590, -0.999969479, -0.000640972]
  Rcl: [ 0.015753553, -0.999845585,  -0.007786590,
        -0.000763582,  0.007775524,  -0.999969479,
        0.999875614, 0.015759018, -0.000640972]
  Pcl: [-0.148302940, -0.112321963, -0.205047198]

time_offset:
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 2  # VELO16
  scan_line: 16
  blind: 0.5

vio:
  max_iterations: 5
  outlier_threshold: 1000
  img_point_cov: 100
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.3
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.01
  voxel_size: 0.5
  max_layer: 3
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "stairs_alpha"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1
